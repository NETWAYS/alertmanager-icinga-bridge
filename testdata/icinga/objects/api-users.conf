object ApiUser "icingaweb"  {

  password = "icingaweb"

  permissions = [
    "actions/*",
    "objects/query/*",
    "objects/modify/*",
    "status/query",
  ]
}

object ApiUser "alertmanager-icinga-bridge"  {

  password = "alertmanager-icinga-bridge"

  permissions = [
    {
      permission = "filter-expression"
    },
    {
      permission = "objects/query/*"
      filter = {{ "external-hosts" in host.groups }}
    },
    {
      permission = "objects/create/service"
      filter = {{ "external-hosts" in host.groups }}
    },
    {
      permission = "objects/modify/service"
      filter = {{ "external-hosts" in host.groups }}
    },
    {
      permission = "objects/delete/service"
      filter = {{ "external-hosts" in host.groups }}
    },
    {
      permission = "actions/process-check-result"
      filter = {{ "external-hosts" in host.groups }}
    },
  ]
}
