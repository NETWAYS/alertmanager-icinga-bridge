---
global:
  # faster interval for demonstration purposes
  scrape_interval: 20s
  evaluation_interval: 20s

rule_files:
  - alerts/*.yml

scrape_configs:
  - job_name: Prometheus
    static_configs:
      - targets:
          - 127.0.0.1:9090
  - job_name: Alertmanager
    static_configs:
      - targets:
          - alertmanager:9093

alerting:
  alertmanagers:
    - static_configs:
      - targets:
          - alertmanager:9093
