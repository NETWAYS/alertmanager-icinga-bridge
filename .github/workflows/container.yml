name: Build Container

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:

# primarily used by the Makefile
env:
  IMAGE_REPOSITORY: ghcr.io/netways/alertmanager-icinga-bridge
  CONTAINER_RUNTIME: docker

jobs:
  push:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v7

      - name: Shared step input
        id: variables
        run: |
          echo "version=${GITHUB_REF#refs/tags/v}" | tee -a $GITHUB_OUTPUT
          echo "registry=${IMAGE_REPOSITORY%%/*}" | tee -a $GITHUB_OUTPUT

      - name: Build image
        run: make build-image "VERSION=${{ steps.variables.outputs.version }}"

      - name: Log in to registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ steps.variables.outputs.registry }} -u ${{ github.actor }} --password-stdin

      - name: Push image
        run: make release-image "VERSION=${{ steps.variables.outputs.version }}"
