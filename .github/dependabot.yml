version: 2
updates:
- package-ecosystem: gomod
  directory: "/"
  schedule:
    interval: weekly
    time: '10:00'
  open-pull-requests-limit: 10

- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: monthly

- package-ecosystem: docker
  directory: "/"
  schedule:
    interval: weekly

- package-ecosystem: docker-compose
  directory: testdata
  schedule:
    interval: monthly
